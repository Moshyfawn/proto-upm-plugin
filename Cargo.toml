[package]
name = "upm_tool"
version = "0.1.0"
edition = "2024"
description = "upm plugin for proto."
license = "MIT"
repository = "https://github.com/Moshyfawn/proto-upm-plugin"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
extism-pdk = { version = "1.4.1", optional = true }
proto_pdk = { version = "0.35.5", optional = true }
rustc-hash = { version = "2.1.2", optional = true }
schematic = { version = "0.20.6", default-features = false, features = ["schema"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
# preserve_order keeps package.json key order intact when pinning.
serde_json = { version = "1.0", features = ["preserve_order"], optional = true }
starbase_utils = { version = "0.14.6", default-features = false, features = ["editor-config", "json"], optional = true }

[dev-dependencies]
proto_pdk_test_utils = "0.50.2"
reqwest = { version = "0.13", features = ["json"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }

[features]
default = ["wasm"]
wasm = [
    "dep:base64",
    "dep:extism-pdk",
    "dep:proto_pdk",
    "dep:rustc-hash",
    "dep:schematic",
    "dep:serde_json",
    "dep:starbase_utils",
]

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "z"
panic = "abort"
